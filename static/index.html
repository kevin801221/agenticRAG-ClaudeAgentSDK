<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic RAG · 決策軌跡</title>
<style>
  :root{
    --ground:#151B2B; --panel:#1E2639; --panel-2:#232C42; --rail:#33405C;
    --ink:#EEF1F8; --muted:#8B96B3;
    --signal:#F2B441;      /* 鈉燈琥珀：正在動作 */
    --alert:#FF7A6B;       /* 折返：檢索不合格，重來 */
    --ok:#6FD3A8;          /* 跑過了 / 有出處支撐 */
    --ext:#8FA8FF;         /* SDK 內建工具：不是這個專案寫的 */
    --mono:"Menlo","SF Mono",ui-monospace,monospace;
    --sans:"Avenir Next","Helvetica Neue",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.65;
    display:flex;flex-direction:column;
  }
  a{color:var(--signal)}

  /* ── 狀態列 ───────────────────────────── */
  header{
    display:flex;align-items:baseline;gap:1.5rem;flex-wrap:wrap;
    padding:.8rem 1.5rem;border-bottom:1px solid var(--rail);background:var(--panel);
  }
  header h1{font-size:1.05rem;margin:0;letter-spacing:.02em;font-weight:600}
  header .sub{color:var(--muted);font-size:.85rem}
  header .spacer{flex:1}
  .badge{
    font-family:var(--mono);font-size:.78rem;padding:.2rem .6rem;
    border:1px solid var(--rail);border-radius:3px;color:var(--muted);white-space:nowrap;
  }
  .badge.live{border-color:var(--signal);color:var(--signal)}
  .badge.warn{border-color:var(--alert);color:var(--alert)}

  /* ── 流程圖 ──────────────────────────── */
  .pipe{border-bottom:1px solid var(--rail);background:var(--panel)}
  .pipe-bar{
    display:flex;align-items:center;gap:.6rem;width:100%;
    padding:.5rem 1.5rem;background:none;border:0;color:var(--muted);
    font:inherit;font-size:.85rem;text-align:left;cursor:pointer;
  }
  .pipe-bar:hover{color:var(--ink)}
  .caret{display:inline-block;font-size:.7rem;transition:transform .2s}
  .pipe:not(.collapsed) .caret{transform:rotate(90deg)}
  .pipe-title{font-weight:600;color:var(--ink)}
  .pipe-meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pipe-meta.live{color:var(--signal)}
  .pipe-body{
    overflow:hidden auto;max-height:var(--pipeH,340px);opacity:1;
    padding:0 1rem .3rem;transition:opacity .22s ease,padding .3s ease;
  }
  .pipe.collapsed .pipe-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0}

  /* 流程圖下緣的橫線：拖它可以調整流程圖區的高度 */
  .hsplit{
    height:7px;background:var(--rail);cursor:row-resize;position:relative;flex-shrink:0;
    transition:background .15s;
  }
  .hsplit::after{content:"";position:absolute;inset:-4px 0}   /* 抓取範圍加大 */
  .hsplit:hover,.hsplit.dragging{background:var(--signal)}
  .hsplit:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  .pipe.collapsed + .hsplit{display:none}      /* 收合時沒有東西可調 */
  body.vresizing{cursor:row-resize;user-select:none}
  .pipe svg{display:block;width:100%;min-width:760px;height:auto}
  @media (prefers-reduced-motion:reduce){
    .pipe-body{transition:none}
  }

  .stage-label{font:600 11px var(--sans);fill:var(--muted);letter-spacing:.08em}
  .stage-band{fill:var(--panel-2);opacity:0;transition:opacity .3s}
  .stage-band.hot{opacity:.55}

  .nbox{fill:var(--panel-2);stroke:var(--rail);stroke-width:1.5;transition:stroke .25s,fill .25s}
  .nlabel{font:600 12.5px var(--mono);fill:var(--ink);transition:fill .25s}
  .nsub{font:10.5px var(--sans);fill:var(--muted)}
  .nhalo{fill:none;stroke:var(--signal);stroke-width:2;opacity:0;
         transform-box:fill-box;transform-origin:center}
  .ncount{font:700 10px var(--mono);fill:var(--ground)}
  .ncountbg{fill:var(--ok);opacity:0;transform-box:fill-box;transform-origin:center}

  /* 這個架構沒給的模組：灰掉。選 Naive RAG，整個 Post-retrieval 欄會暗掉 */
  .node{opacity:1;transition:opacity .3s}
  .node.off{opacity:.2}
  .node.off .nbox{stroke-dasharray:4 4}

  /* SDK 內建工具用不同顏色，學生要分得出哪些是自己寫的 */
  .node.builtin .nbox{stroke:var(--ext)}
  .node.builtin .nsub{fill:var(--ext)}
  .ntag{font:700 8.5px var(--mono);fill:var(--ext);letter-spacing:.06em}

  .node.done .nbox{stroke:var(--ok)}
  .node.done .ncountbg{opacity:1}
  .node.active .nbox{stroke:var(--signal);fill:#3A3320;stroke-dasharray:5 4}
  .node.active .nlabel{fill:var(--signal)}

  .spine{stroke:var(--rail);stroke-width:1.5;fill:none;opacity:.5}
  .chev{fill:var(--rail);opacity:.6}

  .dot{fill:var(--signal);filter:drop-shadow(0 0 7px var(--signal));opacity:0}
  .trail{fill:none;stroke:var(--signal);stroke-width:2.5;opacity:0;stroke-linecap:round}
  .loop{fill:none;stroke:var(--alert);stroke-width:2.5;opacity:0;stroke-linecap:round}
  .looplabel{font:700 11px var(--sans);fill:var(--alert);opacity:0;text-anchor:middle}

  @media (prefers-reduced-motion:no-preference){
    .node.active .nbox{animation:march 1s linear infinite}
    .node.active .nhalo{animation:halo 1.4s ease-out infinite}
    .node.pop .ncountbg{animation:pop .45s ease-out}
    .dot.fly{animation:fly .7s ease-in-out}
    .trail.fly{animation:trail .9s ease-out}
    .loop.fire{animation:loopfire 1.7s ease-out}
    .looplabel.fire{animation:labelfire 1.7s ease-out}
    @keyframes march{to{stroke-dashoffset:-36}}
    @keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
    @keyframes pop{0%{transform:scale(.3)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
    @keyframes fly{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}
    @keyframes trail{0%{opacity:0;stroke-dashoffset:var(--len)}20%{opacity:.9}
                     100%{opacity:0;stroke-dashoffset:0}}
    @keyframes loopfire{0%{opacity:0;stroke-dashoffset:var(--len)}15%{opacity:1}
                        70%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    @keyframes labelfire{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
  }
  @media (prefers-reduced-motion:reduce){
    .node.active .nhalo{opacity:.5}
  }

  /* ── 主要兩欄：軌跡比對話寬，因為過程才是主角 ── */
  main{flex:1;display:grid;grid-template-columns:var(--split,42%) 7px minmax(0,1fr);min-height:0}
  .col{padding:1.25rem 1.5rem;overflow-y:auto;min-height:0}

  /* 拖曳分隔線：字太小就把左邊拉寬 */
  .splitter{background:var(--rail);cursor:col-resize;position:relative;transition:background .15s}
  .splitter::after{content:"";position:absolute;inset:0 -5px}   /* 抓取範圍比視覺寬，好拉 */
  .splitter:hover,.splitter.dragging{background:var(--signal)}
  .splitter:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  body.resizing{cursor:col-resize;user-select:none}
  body.resizing .pagewrap{pointer-events:none}

  /* ── 文件檢視器 ── */
  .docbar{
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
    padding-bottom:.7rem;margin-bottom:.8rem;border-bottom:1px solid var(--rail);
  }
  .docbar .name{font-family:var(--mono);font-size:.85rem;font-weight:600;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docbar button{
    padding:.2rem .6rem;font-size:.8rem;font-weight:400;align-self:auto;
    background:var(--panel-2);color:var(--ink);border:1px solid var(--rail);
  }
  .docbar button:hover:not([disabled]){border-color:var(--signal)}
  .docbar button[disabled]{opacity:.4;cursor:not-allowed}
  .docbar .pageno{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:4.5rem;text-align:center}

  .pagewrap{position:relative;margin:0 auto 1rem;background:#fff;border-radius:3px;
    box-shadow:0 2px 12px rgba(0,0,0,.45);max-width:100%}
  .pagewrap img{display:block;width:100%;height:auto;border-radius:3px}
  .tlayer{position:absolute;inset:0}
  .tlayer span{position:absolute;color:transparent;white-space:pre;line-height:1}

  /* ── 區域錨定框：在頁面上拖出一個可調整的矩形 ── */
  .pagewrap.selectable{cursor:crosshair}
  .sel{
    position:absolute;border:2px solid var(--signal);background:rgba(242,180,65,.16);
    box-shadow:0 0 0 9999px rgba(10,14,24,.34);   /* 框外壓暗，視線集中 */
    cursor:move;
  }
  .sel .h{
    position:absolute;width:11px;height:11px;background:var(--signal);
    border:2px solid #1B1405;border-radius:2px;
  }
  .sel .h.nw{left:-6px;top:-6px;cursor:nwse-resize}
  .sel .h.n {left:calc(50% - 5px);top:-6px;cursor:ns-resize}
  .sel .h.ne{right:-6px;top:-6px;cursor:nesw-resize}
  .sel .h.w {left:-6px;top:calc(50% - 5px);cursor:ew-resize}
  .sel .h.e {right:-6px;top:calc(50% - 5px);cursor:ew-resize}
  .sel .h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
  .sel .h.s {left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}
  .sel .h.se{right:-6px;bottom:-6px;cursor:nwse-resize}
  .sel .cnt{
    position:absolute;left:0;top:-1.55rem;font-size:.72rem;font-family:var(--mono);
    color:#1B1405;background:var(--signal);padding:.05rem .4rem;border-radius:3px;white-space:nowrap;
  }
  .anchor .thumb{
    display:block;max-width:100%;max-height:130px;border:1px solid var(--rail);
    border-radius:3px;margin-bottom:.4rem;background:#fff;
  }
  .doctext{white-space:pre-wrap;font-size:.95rem;line-height:1.75}
  .doctext h4{margin:1.2rem 0 .3rem;font-size:.88rem;color:var(--signal);font-family:var(--mono)}
  .doctext ::selection,.doctext::selection{background:rgba(242,180,65,.42)}
  .dochint{color:var(--muted);font-size:.82rem;margin:0 0 .8rem}

  /* ── 文件問答（右欄）── */
  .anchor{
    display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.6rem;padding:.5rem .7rem;
    border-left:3px solid var(--signal);background:rgba(242,180,65,.08);border-radius:0 4px 4px 0;
  }
  .anchor .txt{flex:1;font-size:.85rem;max-height:6.5rem;overflow-y:auto;white-space:pre-wrap}
  .anchor .lbl{font-size:.72rem;color:var(--signal);font-weight:600;display:block;margin-bottom:.2rem}
  .anchor .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;
    padding:0 .2rem;align-self:flex-start}
  .anchor .x:hover{color:var(--alert)}
  .chatlog{display:flex;flex-direction:column;gap:.9rem;margin-bottom:1rem}
  .msg{font-size:.95rem}
  .msg.me{padding:.6rem .8rem;border-radius:5px;background:var(--panel-2);border:1px solid var(--rail)}
  .msg.me .q{white-space:pre-wrap}
  .msg.me .anchored{font-size:.8rem;color:var(--muted);border-left:2px solid var(--signal);
    padding-left:.5rem;margin-bottom:.4rem;max-height:4.5rem;overflow:hidden}
  .msg.ai .steps{font-size:.8rem;color:var(--muted);font-family:var(--mono);margin-bottom:.4rem}
  .msg.ai .body{white-space:pre-line}
  .msg.ai .body h3{font-size:.95rem;margin:.9rem 0 .25rem;color:var(--signal)}
  .msg.ai .body ul{margin:.25rem 0;padding-left:1.2rem}
  .msg.ai .body li{white-space:normal}
  .msg.ai .body pre{white-space:pre;margin:.5rem 0;border-radius:4px}
  .msg.ai .body code{font-family:var(--mono);font-size:.85em;background:var(--panel);padding:.1rem .3rem;border-radius:3px}
  .msg.ai .body table{border-collapse:collapse;margin:.5rem 0;font-size:.88rem;white-space:normal;width:100%}
  .msg.ai .body th,.msg.ai .body td{border:1px solid var(--rail);padding:.3rem .5rem;text-align:left;vertical-align:top}
  .hidden{display:none !important}

  /* ── 筆記本 ── */
  .savebar{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
  .savebtn{
    padding:.2rem .6rem;font-size:.78rem;font-weight:400;align-self:auto;
    background:none;color:var(--muted);border:1px solid var(--rail);
  }
  .savebtn:hover{border-color:var(--ok);color:var(--ok)}
  .savebtn.saved{border-color:var(--ok);color:var(--ok);cursor:default}
  .noteshead{display:flex;align-items:center;gap:.7rem;margin:.9rem 0 .6rem}
  .noteshead button{padding:.2rem .7rem;font-size:.8rem;font-weight:400;align-self:auto}
  .notes{display:flex;flex-direction:column;gap:.7rem;max-height:46vh;overflow-y:auto}
  .note{border:1px solid var(--rail);border-radius:5px;padding:.6rem .8rem;background:var(--panel-2)}
  .note .q{font-weight:600;font-size:.92rem;margin-bottom:.2rem}
  .note .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:.4rem}
  .note .a{font-size:.86rem;color:var(--ink);opacity:.85;max-height:5.5rem;overflow:hidden;white-space:pre-line}
  .note .row{display:flex;gap:.5rem;margin-top:.5rem}
  .note .row button{padding:.15rem .55rem;font-size:.75rem;font-weight:400;align-self:auto;
    background:none;color:var(--muted);border:1px solid var(--rail)}
  .note .row button:hover{color:var(--ink);border-color:var(--signal)}
  .note .row button.del:hover{color:var(--alert);border-color:var(--alert)}
  .note img{max-width:180px;max-height:90px;border:1px solid var(--rail);border-radius:3px;
    margin-bottom:.4rem;display:block;background:#fff}

  .lede{color:var(--muted);margin:0 0 1rem;max-width:46ch;font-size:.92rem}
  form{display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.1rem}
  .archpick{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--muted)}
  select{
    flex:1;padding:.4rem .55rem;background:var(--panel);color:var(--ink);
    border:1px solid var(--rail);border-radius:4px;font:inherit;font-size:.9rem;
  }
  .archinfo{font-size:.8rem;color:var(--muted);line-height:1.5}
  .archinfo code{font-family:var(--mono);font-size:.92em;color:var(--signal)}
  textarea{
    width:100%;min-height:4.5rem;resize:vertical;padding:.7rem .8rem;
    background:var(--panel);color:var(--ink);border:1px solid var(--rail);
    border-radius:4px;font:inherit;
  }
  textarea:focus-visible,button:focus-visible,select:focus-visible,.chip:focus-visible,summary:focus-visible{
    outline:2px solid var(--signal);outline-offset:2px;
  }
  button{
    align-self:flex-start;padding:.45rem 1.4rem;border:0;border-radius:4px;
    background:var(--signal);color:#1B1405;font:inherit;font-weight:600;cursor:pointer;
  }
  button[disabled]{background:var(--rail);color:var(--muted);cursor:not-allowed}
  .examples{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.4rem}
  .chip{
    font-size:.83rem;padding:.28rem .7rem;border:1px solid var(--rail);border-radius:999px;
    background:none;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:400;
  }
  .chip:hover{border-color:var(--signal);color:var(--ink)}

  h2{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 .9rem;letter-spacing:.06em}
  .answer{font-size:1.02rem;white-space:pre-line}
  .answer h3{font-size:1rem;margin:1.1rem 0 .3rem;color:var(--signal)}
  .answer ul{margin:.3rem 0;padding-left:1.2rem}
  .answer li{white-space:normal}
  .answer code{font-family:var(--mono);font-size:.85em;background:var(--panel);padding:.1rem .3rem;border-radius:3px}
  .answer pre{white-space:pre;margin:.6rem 0;border-radius:4px}
  .answer pre code{background:none;padding:0}
  .answer table{border-collapse:collapse;margin:.6rem 0;font-size:.9rem;white-space:normal;width:100%}
  .answer th,.answer td{border:1px solid var(--rail);padding:.35rem .55rem;text-align:left;vertical-align:top}
  .answer th{background:var(--panel);font-weight:600}
  .answer:empty::after{content:"等一個問題。";color:var(--muted)}
  .cite{
    font-family:var(--mono);font-size:.78rem;padding:.05rem .35rem;margin:0 .1rem;
    border-bottom:1px solid var(--ok);color:var(--ok);cursor:pointer;
  }
  .cite:hover{background:rgba(111,211,168,.12)}
  .source-view{
    margin-top:1rem;padding:.9rem 1rem;background:var(--panel);border-left:2px solid var(--ok);
    border-radius:0 4px 4px 0;font-size:.9rem;
  }
  .source-view .path{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
  .pdfview{width:100%;height:min(62vh,560px);border:1px solid var(--rail);border-radius:4px;background:#fff}
  .pdflink{display:inline-block;margin-top:.5rem;font-size:.82rem}
  .source-view details{border:0;margin-top:.5rem}
  .source-view pre{white-space:pre-wrap;max-height:260px;overflow-y:auto}

  /* ── 軌跡：導軌 + 編號（內容真的是序列） ────── */
  .trace{position:relative;padding-left:2.1rem}
  .trace::before{content:"";position:absolute;left:.72rem;top:.4rem;bottom:.4rem;width:2px;background:var(--rail)}
  .trace:empty{padding-left:0}
  .trace:empty::before{display:none}
  .empty{color:var(--muted);max-width:44ch}

  .node-card{position:relative;margin-bottom:1rem}
  .node-card::before{
    content:"";position:absolute;left:-1.78rem;top:.55rem;width:.78rem;height:.78rem;
    border-radius:50%;background:var(--ground);border:2px solid var(--rail);
  }
  .node-card.act::before{border-color:var(--signal);background:var(--signal)}
  .node-card.turn::before{border-color:var(--alert);background:var(--alert)}

  .why{color:var(--ink);opacity:.88;font-size:.95rem;padding:.1rem 0 .2rem}
  .card{background:var(--panel);border:1px solid var(--rail);border-radius:5px;overflow:hidden}
  .card .head{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;background:var(--panel-2)}
  .card .n{font-family:var(--mono);font-size:.8rem;color:var(--signal)}
  .card .tool{font-family:var(--mono);font-size:.9rem;font-weight:600}
  .card .args{font-family:var(--mono);font-size:.78rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .card .out{padding:.55rem .8rem;font-size:.9rem;border-top:1px solid var(--rail)}
  .card .out.bad{color:var(--alert)}
  details{border-top:1px solid var(--rail)}
  summary{padding:.45rem .8rem;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none}
  summary:hover{color:var(--ink)}
  pre{margin:0;padding:.8rem;background:#11162a;overflow-x:auto;
    font-family:var(--mono);font-size:.78rem;line-height:1.55;color:#CBD3E6}

  .pivot{
    margin:.2rem 0 1rem;padding:.55rem .9rem;border-left:3px solid var(--alert);
    background:rgba(255,122,107,.09);border-radius:0 4px 4px 0;font-size:.95rem;color:var(--alert);
  }
  .pivot strong{color:var(--ink);font-weight:600}

  footer{border-top:1px solid var(--rail);background:var(--panel);padding:1rem 1.5rem}
  footer > details > summary{padding:0;font-size:.9rem;color:var(--ink)}
  .corpus{display:grid;gap:.35rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:.8rem}
  .cfile{
    display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;
    background:none;border:1px solid var(--rail);border-radius:4px;
    color:var(--ink);font:inherit;font-size:.85rem;text-align:left;cursor:pointer;
  }
  .cfile:hover{border-color:var(--signal)}
  .cfile .kind{font-family:var(--mono);font-size:.68rem;padding:.05rem .3rem;border-radius:2px;
    border:1px solid currentColor;flex-shrink:0}
  .cfile.pdf .kind{color:var(--ext)}
  .cfile.md .kind{color:var(--muted)}
  .cfile .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cfile .n{font-family:var(--mono);font-size:.72rem;color:var(--muted);flex-shrink:0}
  footer > details + details{margin-top:.7rem}

  .patterns{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:1rem}
  .pat h3{margin:0 0 .25rem;font-size:.95rem}
  .pat p{margin:0 0 .3rem;font-size:.86rem;color:var(--muted)}
  .pat .where{font-family:var(--mono);font-size:.76rem;color:var(--signal)}

  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .col.ask{border-right:0;border-bottom:1px solid var(--rail)}
    .col{overflow-y:visible}
    body{height:auto}
  }
</style>
</head>
<body>

<header>
  <h1>Agentic RAG</h1>
  <span class="sub">檢索策略由模型當場決定 —— 上面是流程，右邊是它的判斷理由</span>
  <span class="spacer"></span>
  <span class="badge" id="corpus">載入中</span>
  <span class="badge" id="engine">—</span>
</header>

<section class="pipe collapsed" id="pipeWrap">
  <button class="pipe-bar" id="pipeToggle" type="button" aria-expanded="false" aria-controls="pipeBody">
    <span class="caret" aria-hidden="true">▸</span>
    <span class="pipe-title">流程圖</span>
    <span class="pipe-meta" id="pipeMeta">—</span>
  </button>
  <div class="pipe-body" id="pipeBody">
    <svg id="pipe" role="img" aria-label="RAG 流程圖，執行中的模組會亮起"></svg>
  </div>
</section>

<div class="hsplit" id="hsplit" role="separator" aria-orientation="horizontal"
     aria-label="調整流程圖區高度" tabindex="0"></div>

<main>
  <section class="col ask" id="leftCol">
    <div id="askView">
    <p class="lede">問一個關於 Claude Code 的問題。上面的流程圖會顯示它走到哪一步。</p>

    <form id="form">
      <label class="archpick"><span>架構</span><select id="arch"></select></label>
      <div class="archinfo" id="archinfo"></div>
      <textarea id="q" placeholder="例如：hook 要怎麼擋住寫入 .env？" required></textarea>
      <button id="go" type="submit">問</button>
    </form>

    <div class="examples" id="examples"></div>

    <h2>答案</h2>
    <div class="answer" id="answer"></div>
    <div id="sourceView"></div>
    </div><!-- /askView -->

    <div id="docView" class="hidden">
      <div class="docbar">
        <span class="name" id="docName"></span>
        <button type="button" id="pagePrev" title="上一頁">‹</button>
        <span class="pageno" id="pageNo"></span>
        <button type="button" id="pageNext" title="下一頁">›</button>
        <button type="button" id="docClose">關閉文件</button>
      </div>
      <p class="dochint" id="docHint">在頁面上拖一個框（可以再調整大小、拖動），框裡的內容就會錨定到右邊 —— 接著直接問。</p>
      <div id="docBody"></div>
    </div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
       aria-label="調整左右兩區寬度" tabindex="0"></div>

  <section class="col">
    <div id="traceView">
      <h2>決策軌跡</h2>
      <div class="trace" id="trace"></div>
      <p class="empty" id="empty">還沒開始。每次 agent 選一個做法、呼叫一個模組，上面會亮、這裡會長出一段。</p>
    </div>

    <div id="docChat" class="hidden">
      <h2>問這份文件</h2>
      <div class="chatlog" id="chatLog"></div>
      <div class="anchor hidden" id="anchorBox">
        <div class="txt"><span class="lbl">已錨定這一區</span><img class="thumb hidden" id="anchorThumb" alt="框選區域預覽"><span id="anchorText"></span></div>
        <button class="x" type="button" id="anchorClear" title="取消錨定">✕</button>
      </div>
      <form id="docForm">
        <textarea id="docQ" placeholder="圈選一段再問，或直接問這份文件的任何問題" required></textarea>
        <button id="docGo" type="submit">問</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <details id="notesPanel">
    <summary>筆記本 <span id="notesCount"></span></summary>
    <div class="noteshead">
      <button type="button" id="notesExport">匯出 Markdown</button>
      <span class="pipe-meta">存下來的問答會寫進 notes/，匯出的 .md 可以直接貼進教材</span>
    </div>
    <div class="notes" id="notesList"></div>
  </details>
  <details>
    <summary>語料庫 — 點檔名直接看，PDF 會開閱讀器</summary>
    <div class="corpus" id="corpusList"></div>
  </details>
  <details>
    <summary>架構圖書館 — 同一組模組，換不同政策</summary>
    <div class="patterns" id="patterns"></div>
  </details>
</footer>

<script>
const $ = id => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
const trace = $('trace'), answerEl = $('answer'), sourceView = $('sourceView');
let ARCHS = [], STAGES = [], NODES = {}, lastNode = null, lastTool = null, FLOOR = 0;
let lastAnswer = '', lastQuestion = '';
// 使用者手動打開的話，跑完就不要自動收回去 —— 他正在看
let pipePinned = false;

const EXAMPLES = [
  'hook 要怎麼擋住寫入 .env？',
  '那個會擋東西的功能怎麼設？',          // 刻意口語 -> 逼 agent 換術語
  'sub-agent 跟 agent team 差在哪？',
  '為什麼 allowed_tools 擋不住內建工具？',
  '2026 年溫布頓男單冠軍是誰？',          // 知識庫外 -> CRAG 會走 WebSearch
];

/* ══════════ 流程圖 ══════════ */

const W = 1200, HEAD = 30, TOP = 52, NH = 40, NGAP = 13;

function buildPipe(stages) {
  // 最後一欄是「生成答案」—— 它不是模組，但學生需要看到流程的終點
  STAGES = [...stages, { stage: 'Generation', modules: [{ name: 'answer', description: '產生答案' }] }];

  const cols = STAGES.length, colW = W / cols;
  const maxRows = Math.max(...STAGES.map(s => s.modules.length));
  const H = TOP + maxRows * (NH + NGAP) + 58;
  FLOOR = TOP + maxRows * (NH + NGAP) + 14;   // 折返弧線走這條底線，不會穿過任何節點

  const svg = $('pipe');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = '';
  NODES = {};

  const add = (tag, attrs, parent) => {
    const el = document.createElementNS(SVG, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(el);
    return el;
  };

  const midY = TOP + (maxRows * (NH + NGAP)) / 2 - NGAP / 2;

  STAGES.forEach((st, c) => {
    const x = c * colW;
    add('rect', { class: 'stage-band', id: 'band-' + c, x: x + 6, y: HEAD - 16,
                  width: colW - 12, height: H - HEAD + 8, rx: 8 });
    add('text', { class: 'stage-label', x: x + 18, y: HEAD }).textContent = st.stage.toUpperCase();

    if (c < STAGES.length - 1) {
      add('path', { class: 'spine', d: 'M ' + (x + colW - 16) + ' ' + midY + ' L ' + (x + colW + 4) + ' ' + midY });
      add('path', { class: 'chev', d: 'M ' + (x + colW + 3) + ' ' + (midY - 4) + ' l 7 4 l -7 4 z' });
    }

    st.modules.forEach((m, r) => {
      const nx = x + 18, ny = TOP + r * (NH + NGAP), nw = colW - 36;
      const g = add('g', { class: 'node' + (m.builtin ? ' builtin' : ''), id: 'n-' + m.name });
      add('rect', { class: 'nhalo', x: nx - 3, y: ny - 3, width: nw + 6, height: NH + 6, rx: 7 }, g);
      add('rect', { class: 'nbox', x: nx, y: ny, width: nw, height: NH, rx: 6 }, g);
      add('text', { class: 'nlabel', x: nx + 11, y: ny + 17 }, g).textContent = m.name;
      const sub = add('text', { class: 'nsub', x: nx + 11, y: ny + 31 }, g);
      sub.textContent = (m.description || '').slice(0, Math.floor(nw / 12));
      if (m.builtin) add('text', { class: 'ntag', x: nx + nw - 30, y: ny + 35 }, g).textContent = 'SDK';
      add('circle', { class: 'ncountbg', cx: nx + nw - 15, cy: ny + 15, r: 9 }, g);
      const cnt = add('text', { class: 'ncount', x: nx + nw - 15, y: ny + 18.5, 'text-anchor': 'middle' }, g);
      NODES[m.name] = { g: g, cnt: cnt, runs: 0, col: c, name: m.name,
                        cx: nx + nw / 2, cy: ny + NH / 2,
                        left: nx, right: nx + nw, bottom: ny + NH };
    });
  });

  // 動畫圖層放最後，才會蓋在節點上方
  add('path', { class: 'trail', id: 'trail', d: '' });
  add('path', { class: 'loop', id: 'loop', d: '' });
  add('text', { class: 'looplabel', id: 'looplabel', x: 0, y: 0 }).textContent = '折返 · 重查';
  add('path', { id: 'flowpath', fill: 'none', stroke: 'none', d: '' });
  const dot = add('circle', { class: 'dot', id: 'dot', r: 5.5 });
  const anim = document.createElementNS(SVG, 'animateMotion');
  anim.setAttribute('id', 'flowanim');
  anim.setAttribute('dur', '0.7s');
  anim.setAttribute('begin', 'indefinite');
  const mp = document.createElementNS(SVG, 'mpath');
  mp.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#flowpath');
  mp.setAttribute('href', '#flowpath');
  anim.appendChild(mp);
  dot.appendChild(anim);
}

function paintArchitecture(arch) {
  const allowed = {};
  (arch ? arch.modules.concat(arch.builtin_tools || []) : []).concat(['answer'])
    .forEach(m => { allowed[m] = 1; });
  for (const name in NODES) NODES[name].g.classList.toggle('off', !allowed[name]);
}

function setPipeOpen(open) {
  const wrap = $('pipeWrap');
  wrap.classList.toggle('collapsed', !open);
  $('pipeToggle').setAttribute('aria-expanded', String(open));
}

function totalCalls() {
  return Object.values(NODES).reduce((n, x) => n + (x.name === 'answer' ? 0 : x.runs), 0);
}

function pipeIsOpen() {
  return !$('pipeWrap').classList.contains('collapsed');
}

/** 收起來的時候，標題列要看得出「現在在哪一步」，不然收合等於看不到 */
function pipeMeta(text, live) {
  const el = $('pipeMeta');
  el.textContent = text;
  el.classList.toggle('live', !!live);
}

function archLabel() {
  const a = ARCHS.filter(x => x.key === $('arch').value)[0];
  if (!a) return '';
  const n = a.modules.length + (a.builtin_tools || []).length;
  return `${a.name} · ${n} 個模組`;
}

$('pipeToggle').onclick = () => {
  const open = !pipeIsOpen();
  setPipeOpen(open);
  pipePinned = open;          // 手動打開 = 釘住；手動關掉 = 解除
};

function resetPipe() {
  for (const name in NODES) {
    const n = NODES[name];
    n.g.classList.remove('active', 'done', 'pop');
    n.runs = 0;
    n.cnt.textContent = '';
  }
  lastNode = null; lastTool = null;
  ['trail', 'loop', 'looplabel'].forEach(id => $(id).classList.remove('fly', 'fire'));
  STAGES.forEach((_, c) => $('band-' + c).classList.remove('hot'));
}

function restart(el, cls) {          // 重新觸發 CSS 動畫
  el.classList.remove(cls);
  void el.getBoundingClientRect();
  el.classList.add(cls);
}

function activate(name) {
  const n = NODES[name];
  if (!n) return;
  if (lastNode && lastNode !== n) lastNode.g.classList.remove('active');
  if (lastNode) flow(lastNode, n);

  n.g.classList.add('active', 'done');
  n.runs += 1;
  n.cnt.textContent = n.runs;
  restart(n.g, 'pop');
  STAGES.forEach((_, c) => $('band-' + c).classList.toggle('hot', c === n.col));
  pipeMeta(`${archLabel()} · 第 ${totalCalls()} 步：${name}`, true);
  lastNode = n;
}

/** 從 a 飛到 b。三種情況：
 *   同一個模組再跑一次 → 不畫線，只重新脈動
 *   同一階段換模組     → 短弧線（正常前進，不是折返）
 *   真的退回前面的階段 → 大迴圈 + 紅色「折返」標籤 ← CRAG 自我修正的視覺高潮
 */
function flow(a, b) {
  if (a === b) return;
  const back = b.col < a.col;
  const sameCol = b.col === a.col;
  const d = back
    ? 'M ' + a.cx + ' ' + a.bottom + ' C ' + a.cx + ' ' + FLOOR + ', '
        + b.cx + ' ' + FLOOR + ', ' + b.cx + ' ' + b.bottom
    : sameCol
    ? 'M ' + a.right + ' ' + a.cy + ' C ' + (a.right + 20) + ' ' + a.cy + ', '
        + (b.right + 20) + ' ' + b.cy + ', ' + b.right + ' ' + b.cy
    : 'M ' + a.right + ' ' + a.cy + ' C ' + ((a.right + b.left) / 2) + ' ' + a.cy + ', '
        + ((a.right + b.left) / 2) + ' ' + b.cy + ', ' + b.left + ' ' + b.cy;

  $('flowpath').setAttribute('d', d);
  const anim = $('flowanim');
  if (anim && anim.beginElement) { try { anim.beginElement(); } catch (e) {} }
  restart($('dot'), 'fly');

  const line = back ? $('loop') : $('trail');
  line.setAttribute('d', d);
  const len = line.getTotalLength ? line.getTotalLength() : 320;
  line.style.setProperty('--len', len);
  line.style.strokeDasharray = len;
  restart(line, back ? 'fire' : 'fly');

  if (back) {
    const lab = $('looplabel');
    lab.setAttribute('x', (a.cx + b.cx) / 2);
    lab.setAttribute('y', FLOOR + 16);
    restart(lab, 'fire');
  }
}

function finishPipe() {
  activate('answer');
  const n = NODES['answer'];
  if (n) setTimeout(() => n.g.classList.remove('active'), 1400);
}

/* ══════════ 載入 ══════════ */

EXAMPLES.forEach(text => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = text;
  b.onclick = () => { $('q').value = text; $('form').requestSubmit(); };
  $('examples').appendChild(b);
});

fetch('/api/health').then(r => r.json()).then(h => {
  $('corpus').textContent = h.chunks + ' 片段 · ' + h.files + ' 檔案 · ' + h.vector_store;
  const e = $('engine');
  e.textContent = h.engine_label;
  e.className = 'badge live';
  if (!h.has_vectors) {
    const w = document.createElement('span');
    w.className = 'badge warn';
    w.textContent = '降級：純 BM25，無向量';
    e.after(w);
  }
});

Promise.all([
  fetch('/api/pipeline').then(r => r.json()),
  fetch('/api/architectures').then(r => r.json()),
]).then(function (res) {
  buildPipe(res[0]);
  ARCHS = res[1];

  $('arch').innerHTML = ARCHS.map(a =>
    '<option value="' + a.key + '"' + (a.key === 'crag' ? ' selected' : '') + '>' + esc(a.name) + '</option>').join('');
  $('arch').onchange = showArch;
  showArch();

  $('patterns').innerHTML = ARCHS.map(a =>
    '<div class="pat"><h3>' + esc(a.name) + '</h3>' +
    '<p>' + esc(a.orchestration) + ' · ' + esc(a.paper) + '</p>' +
    '<div class="where">' + a.modules.map(esc).join(' · ') + '</div></div>').join('');
});

function showArch() {
  const a = ARCHS.filter(x => x.key === $('arch').value)[0];
  if (!a) return;
  paintArchitecture(a);
  if (!pipeIsOpen()) pipeMeta(archLabel());
  $('archinfo').innerHTML =
    esc(a.orchestration) + '　模組：<code>' +
    a.modules.concat(a.builtin_tools || []).map(esc).join('</code> <code>') + '</code>';
}

/* ══════════ 問答 ══════════ */

$('form').onsubmit = ev => { ev.preventDefault(); ask($('q').value.trim()); };

function ask(question) {
  if (!question) return;
  lastQuestion = question;
  lastAnswer = '';
  trace.innerHTML = '';
  answerEl.textContent = '';
  sourceView.innerHTML = '';
  $('empty').style.display = 'none';
  $('go').disabled = true;
  $('go').textContent = '思考中…';
  resetPipe();
  setPipeOpen(true);
  pipeMeta(archLabel() + ' · 執行中', true);

  const es = new EventSource('/api/ask?q=' + encodeURIComponent(question)
                             + '&arch=' + encodeURIComponent($('arch').value));
  es.onmessage = m => handle(JSON.parse(m.data), es);
  es.onerror = () => finish(es);
}

function finish(es) {
  es.close();
  $('go').disabled = false;
  $('go').textContent = '問';
}

function handle(ev, es) {
  if (ev.type === 'status' || ev.type === 'reasoning')
    return card('think', '<div class="why">' + esc(ev.text) + '</div>');

  if (ev.type === 'tool_call') {
    // 上一步在評分、這一步又去查 —— 這就是自我修正，流程圖會畫出折返
    if (lastTool === 'grade_documents' && ev.tool.indexOf('search') >= 0) {
      const p = document.createElement('div');
      p.className = 'pivot';
      p.innerHTML = '<strong>折返</strong> — 上一輪檢索被自己判定不合格，換個查法重來。';
      trace.appendChild(p);
    }
    activate(ev.tool);
    lastTool = ev.tool;
    return card('act',
      '<div class="card"><div class="head">' +
        '<span class="n">' + ev.step + '</span>' +
        '<span class="tool">' + esc(ev.tool) + '</span>' +
        '<span class="args">' + esc(JSON.stringify(ev.args)) + '</span>' +
      '</div>' +
      '<div class="out" id="out-' + ev.step + '">執行中…</div>' +
      '<details><summary>看這個模組的程式碼</summary><pre>' + esc(ev.source || '') + '</pre></details></div>');
  }

  if (ev.type === 'tool_result') {
    const out = $('out-' + ev.step);
    if (out) {
      out.textContent = ev.summary;
      out.className = 'out' + (/失敗|^0 筆/.test(ev.summary) ? ' bad' : '');
    }
    return;
  }

  if (ev.type === 'answer') {
    finishPipe();
    renderAnswer(ev.text);
    lastAnswer = ev.text;
    return;
  }

  if (ev.type === 'error') {
    card('turn', '<div class="pivot"><strong>錯誤</strong> — ' + esc(ev.text) + '</div>');
    if (ev.fatal) finish(es);
    return;
  }

  if (ev.type === 'done') {
    pipeMeta(`${archLabel()} · 完成 ${ev.turns} 次呼叫 · ${(ev.elapsed_ms / 1000).toFixed(1)} 秒`);
    // 留 1.8 秒讓最後一步看得完，再收回去。使用者自己打開的就不要動它。
    if (!pipePinned) setTimeout(() => { if (!pipePinned) setPipeOpen(false); }, 1800);
    if (lastAnswer) {
      noteBar($('answer'), () => ({
        question: lastQuestion,
        answer: lastAnswer,
        source: '',
        arch: $('arch').value,
        citations: [...$('answer').querySelectorAll('.cite')].map(c => c.dataset.id),
      }));
    }
    card('think', '<div class="why">完成：' + esc(ev.architecture || '') + ' · ' + ev.turns +
                  ' 次模組呼叫 · ' + (ev.elapsed_ms / 1000).toFixed(1) + ' 秒</div>');
    finish(es);
  }
}

// 答案裡的 [某檔案.md#12] 轉成可點的出處
function renderAnswer(text) {
  answerEl.innerHTML = md(text).replace(/\[([^\[\]\s]+#\d+)\]/g,
    (_, id) => '<span class="cite" data-id="' + id + '" role="button" tabindex="0">' + id + '</span>');
  answerEl.querySelectorAll('.cite').forEach(el => {
    const show = () => showSource(el.dataset.id);
    el.onclick = show;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(); } };
  });
}

fetch('/api/corpus').then(r => r.json()).then(list => {
  $('corpusList').innerHTML = list.map(f =>
    '<button class="cfile ' + (f.is_pdf ? 'pdf' : 'md') + '" type="button" data-path="' + esc(f.path) + '">' +
      '<span class="kind">' + (f.is_pdf ? 'PDF' : 'MD') + '</span>' +
      '<span class="nm">' + esc(f.path.replace(/^papers\//, '')) + '</span>' +
      '<span class="n">' + (f.is_pdf ? f.pages + ' 頁' : f.chunks + ' 段') + '</span>' +
    '</button>').join('');

  $('corpusList').querySelectorAll('.cfile').forEach(b => {
    b.onclick = () => {
      openDoc(b.dataset.path, b.classList.contains('pdf'), 1);
      $('leftCol').scrollTo({ top: 0 });
      document.querySelectorAll('footer details').forEach(d => { d.open = false; });
    };
  });
});

/* ══════════ 筆記本 ══════════ */

function noteBar(container, payload) {
  const bar = document.createElement('div');
  bar.className = 'savebar';
  const b = document.createElement('button');
  b.className = 'savebtn';
  b.type = 'button';
  b.textContent = '＋ 存進筆記本';
  b.onclick = () => {
    b.disabled = true;
    b.textContent = '存檔中…';
    fetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload()),
    })
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(() => { b.textContent = '✓ 已存'; b.classList.add('saved'); loadNotes(); })
      .catch(() => { b.disabled = false; b.textContent = '存檔失敗，再試一次'; });
  };
  bar.appendChild(b);
  container.appendChild(bar);
}

function loadNotes() {
  fetch('/api/notes').then(r => r.json()).then(list => {
    $('notesCount').textContent = list.length ? '(' + list.length + ')' : '';
    $('notesList').innerHTML = list.length ? '' : '<p class="empty">還沒有筆記。看到好的回答就按「存進筆記本」。</p>';
    list.forEach(n => {
      const d = document.createElement('div');
      d.className = 'note';
      d.innerHTML =
        '<div class="q">' + esc(n.question) + '</div>' +
        '<div class="meta">' + esc(n.created_at) + (n.source ? ' ｜ ' + esc(n.source) : '') + '</div>' +
        (n.image ? '<img src="/api/notes/image/' + n.id + '" alt="錨定區域">' : '') +
        '<div class="a">' + esc(n.answer.slice(0, 320)) + (n.answer.length > 320 ? '…' : '') + '</div>' +
        '<div class="row"></div>';
      const row = d.querySelector('.row');
      if (n.source) {
        const open = document.createElement('button');
        open.type = 'button';
        open.textContent = '開啟來源';
        open.onclick = () => {
          openDoc(n.source, n.source.toLowerCase().endsWith('.pdf'), 1);
          $('notesPanel').open = false;
        };
        row.appendChild(open);
      }
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '刪除';
      del.onclick = () => {
        fetch('/api/notes/' + n.id, { method: 'DELETE' }).then(loadNotes);
      };
      row.appendChild(del);
      $('notesList').appendChild(d);
    });
  });
}

$('notesExport').onclick = () => { window.location = '/api/notes/export'; };
loadNotes();

/* ══════════ 可拖曳分隔線 ══════════ */

(function () {
  const main = document.querySelector('main');
  const bar = $('splitter');
  const MIN = 22, MAX = 78;          // 百分比，不讓任一邊被壓到看不見

  function setSplit(pct) {
    main.style.setProperty('--split', Math.min(MAX, Math.max(MIN, pct)) + '%');
  }
  try {
    const saved = localStorage.getItem('split');
    if (saved) setSplit(parseFloat(saved));
  } catch (e) {}

  let dragging = false;
  const move = e => {
    if (!dragging) return;
    const r = main.getBoundingClientRect();
    setSplit(((e.clientX - r.left) / r.width) * 100);
  };
  const stop = () => {
    if (!dragging) return;
    dragging = false;
    bar.classList.remove('dragging');
    document.body.classList.remove('resizing');
    try {
      localStorage.setItem('split', parseFloat(main.style.getPropertyValue('--split')));
    } catch (e) {}
  };

  bar.addEventListener('mousedown', e => {
    dragging = true; e.preventDefault();
    bar.classList.add('dragging');
    document.body.classList.add('resizing');
  });
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', stop);

  // 鍵盤也要能調（分隔線是可 focus 的）
  bar.addEventListener('keydown', e => {
    const cur = parseFloat(main.style.getPropertyValue('--split') || '42');
    if (e.key === 'ArrowLeft') { setSplit(cur - 3); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setSplit(cur + 3); e.preventDefault(); }
  });
})();

/* ══════════ 流程圖高度：拖下面那條橫線 ══════════ */

(function () {
  const bar = $('hsplit'), wrap = $('pipeWrap');
  const MIN = 90, MAX = () => Math.round(window.innerHeight * 0.72);

  function setH(px) {
    wrap.style.setProperty('--pipeH', Math.min(MAX(), Math.max(MIN, px)) + 'px');
  }
  try {
    const saved = localStorage.getItem('pipeH');
    if (saved) setH(parseFloat(saved));
  } catch (e) {}

  let dragging = false;
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    setH(e.clientY - $('pipeBody').getBoundingClientRect().top);
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    bar.classList.remove('dragging');
    document.body.classList.remove('vresizing');
    try {
      localStorage.setItem('pipeH', parseFloat(wrap.style.getPropertyValue('--pipeH')));
    } catch (e) {}
    // 高度變了，PDF 文字層的座標要重算
    if (DOC.path && DOC.isPdf) renderDoc();
  });
  bar.addEventListener('mousedown', e => {
    dragging = true; e.preventDefault();
    bar.classList.add('dragging');
    document.body.classList.add('vresizing');
  });
  bar.addEventListener('keydown', e => {
    const cur = parseFloat(wrap.style.getPropertyValue('--pipeH') || '340');
    if (e.key === 'ArrowUp') { setH(cur - 24); e.preventDefault(); }
    if (e.key === 'ArrowDown') { setH(cur + 24); e.preventDefault(); }
  });
})();

/* ══════════ 文件檢視器 ══════════ */

const DOC = { path: null, page: 1, pages: 1, isPdf: false };

function openDoc(path, isPdf, page) {
  DOC.path = path; DOC.isPdf = isPdf; DOC.page = page || 1;
  $('askView').classList.add('hidden');
  $('traceView').classList.add('hidden');
  $('docView').classList.remove('hidden');
  $('docChat').classList.remove('hidden');
  $('docName').textContent = path;
  clearAnchor();
  $('chatLog').innerHTML = '';
  renderDoc();
  $('docQ').focus();
}

function closeDoc() {
  DOC.path = null;
  $('docView').classList.add('hidden');
  $('docChat').classList.add('hidden');
  $('askView').classList.remove('hidden');
  $('traceView').classList.remove('hidden');
  clearAnchor();
}

$('docClose').onclick = closeDoc;
$('pagePrev').onclick = () => gotoPage(DOC.page - 1);
$('pageNext').onclick = () => gotoPage(DOC.page + 1);

function gotoPage(n) {
  if (!DOC.isPdf || n < 1 || n > DOC.pages) return;
  DOC.page = n;
  renderDoc();
}

function renderDoc() {
  const body = $('docBody');
  const nav = DOC.isPdf;
  $('pagePrev').classList.toggle('hidden', !nav);
  $('pageNext').classList.toggle('hidden', !nav);
  $('pageNo').classList.toggle('hidden', !nav);

  if (!DOC.isPdf) {
    body.innerHTML = '<div class="doctext">載入中…</div>';
    fetch('/api/doc?path=' + encodeURIComponent(DOC.path))
      .then(r => r.json())
      .then(d => {
        body.innerHTML = '<div class="doctext">' + d.chunks.map(c =>
          '<h4>' + esc(c.heading) + '</h4>' + esc(c.text)).join('\n\n') + '</div>';
      });
    return;
  }

  body.innerHTML = '<div class="pagewrap" id="pageWrap"><img id="pageImg" alt="第 ' + DOC.page + ' 頁"></div>';
  const wrap = $('pageWrap'), img = $('pageImg');

  Promise.all([
    new Promise(res => { img.onload = res; img.src = '/api/page?path=' +
      encodeURIComponent(DOC.path) + '&page=' + DOC.page; }),
    fetch('/api/words?path=' + encodeURIComponent(DOC.path) + '&page=' + DOC.page).then(r => r.json()),
  ]).then(([, d]) => {
    DOC.pages = d.pages;
    $('pageNo').textContent = DOC.page + ' / ' + d.pages;
    $('pagePrev').disabled = DOC.page <= 1;
    $('pageNext').disabled = DOC.page >= d.pages;
    layoutWords(wrap, d);
  });
}

/** 在頁面圖片上疊一層透明的字 —— 這樣圈選就是原生的網頁選取。
 *  Chrome 內建的 PDF 檢視器是獨立程序，外面碰不到它的選取，所以才要自己疊。 */
function layoutWords(wrap, d) {
  const scale = wrap.clientWidth / d.width;      // PDF point → CSS px
  DOC.words = d.words;                            // 給區域錨定算「框裡有哪些字」
  DOC.scale = scale;
  wrap.classList.add('selectable');
  const layer = document.createElement('div');
  layer.className = 'tlayer';
  let lastLine = null;
  layer.innerHTML = d.words.map(w => {
    // 換行時補一個換行字元，選取跨行才不會全部黏在一起
    const br = (lastLine !== null && w.line !== lastLine) ? '\n' : '';
    lastLine = w.line;
    return '<span style="left:' + (w.x * scale).toFixed(1) + 'px;top:' + (w.y * scale).toFixed(1) +
      'px;width:' + (w.w * scale).toFixed(1) + 'px;height:' + (w.h * scale).toFixed(1) +
      'px;font-size:' + (w.h * scale * 0.86).toFixed(1) + 'px">' + esc(br + w.t + ' ') + '</span>';
  }).join('');
  wrap.appendChild(layer);
}

// 視窗或分隔線變動時，文字層要跟著重算
let relayout;
window.addEventListener('resize', () => {
  clearTimeout(relayout);
  relayout = setTimeout(() => { if (DOC.path && DOC.isPdf) renderDoc(); }, 250);
});

/* ══════════ AI Anchor：圈選就錨定 ══════════ */

let anchorText = '';

function clearAnchor() {
  anchorText = '';
  $('anchorBox').classList.add('hidden');
  $('anchorText').textContent = '';
  $('anchorThumb').classList.add('hidden');
  clearRegion();
  try { window.getSelection().removeAllRanges(); } catch (e) {}
}

$('anchorClear').onclick = clearAnchor;

/* 區域錨定：在 PDF 頁面上拖出一個可調整的方框，框裡的字就是錨定內容。
   為什麼不用瀏覽器的文字選取：PDF 的文字層是我們自己疊的一堆小方塊，
   跨欄、跨圖時選取會亂跑；而且論文常常要框的是「一張圖 + 它的說明」，
   那本來就是一塊區域，不是一段連續文字。 */

let SEL = null;        // {x, y, w, h} 以 CSS px 為單位，相對 pagewrap

function clearRegion() {
  SEL = null;
  const box = document.querySelector('.sel');
  if (box) box.remove();
}

function ensureSelBox() {
  let box = document.querySelector('.sel');
  if (!box) {
    box = document.createElement('div');
    box.className = 'sel';
    box.innerHTML = '<span class="cnt"></span>' +
      ['nw','n','ne','w','e','sw','s','se'].map(k => '<i class="h ' + k + '" data-h="' + k + '"></i>').join('');
    ($('pageWrap') || $('docBody')).appendChild(box);
  }
  return box;
}

function drawSel() {
  if (!SEL) return;
  const box = ensureSelBox();
  box.style.left = SEL.x + 'px';
  box.style.top = SEL.y + 'px';
  box.style.width = SEL.w + 'px';
  box.style.height = SEL.h + 'px';
}

/** 框裡有哪些字 —— 以字的中心點是否落在框內判斷 */
function wordsInSel() {
  if (!SEL || !DOC.words) return '';
  const sc = DOC.scale;
  const picked = DOC.words.filter(w => {
    const cx = (w.x + w.w / 2) * sc, cy = (w.y + w.h / 2) * sc;
    return cx >= SEL.x && cx <= SEL.x + SEL.w && cy >= SEL.y && cy <= SEL.y + SEL.h;
  });
  let out = '', lastLine = null;
  for (const w of picked) {
    if (lastLine !== null && w.line !== lastLine) out += '\n';
    else if (out) out += ' ';
    out += w.t;
    lastLine = w.line;
  }
  return out.trim();
}

/** 把框住的那塊裁成縮圖，讓使用者確認自己框到什麼 */
function cropThumb() {
  const img = $('pageImg');
  if (!img || !SEL) return '';
  const r = img.naturalWidth / img.clientWidth;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(SEL.w * r));
  c.height = Math.max(1, Math.round(SEL.h * r));
  c.getContext('2d').drawImage(img, SEL.x * r, SEL.y * r, c.width, c.height, 0, 0, c.width, c.height);
  try { return c.toDataURL('image/png'); } catch (e) { return ''; }
}

function commitAnchor() {
  if (!SEL || SEL.w < 8 || SEL.h < 8) { clearRegion(); clearAnchor(); return; }
  const text = wordsInSel();
  const box = ensureSelBox();
  box.querySelector('.cnt').textContent = text ? (text.split(/\s+/).length + ' 個詞') : '沒有文字';

  anchorText = text.slice(0, 4000);
  const thumb = cropThumb();
  $('anchorText').textContent = text ||
    '（這一區沒有抓到文字，可能是圖或表格。可以連圖說一起框，或直接描述你想問什麼。）';
  const t = $('anchorThumb');
  if (thumb) { t.src = thumb; t.classList.remove('hidden'); } else { t.classList.add('hidden'); }
  $('anchorBox').classList.remove('hidden');
  $('docQ').focus();
}

/* 拖曳：畫新框 / 移動 / 縮放，共用同一組 pointer 事件 */
(function () {
  let mode = null, handle = null, start = null, orig = null;

  const wrapOf = () => $('pageWrap');
  const local = e => {
    const r = wrapOf().getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, mw: r.width, mh: r.height };
  };

  $('docBody').addEventListener('mousedown', e => {
    if (!DOC.isPdf || !wrapOf()) return;
    const h = e.target.closest('.h');
    const inBox = e.target.closest('.sel');
    if (!h && !inBox && !e.target.closest('.pagewrap')) return;
    e.preventDefault();

    start = local(e);
    orig = SEL ? { ...SEL } : null;
    if (h) { mode = 'resize'; handle = h.dataset.h; }
    else if (inBox) { mode = 'move'; }
    else { mode = 'draw'; SEL = { x: start.x, y: start.y, w: 0, h: 0 }; drawSel(); }
    document.body.classList.add('resizing');
  });

  window.addEventListener('mousemove', e => {
    if (!mode) return;
    const p = local(e);
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    if (mode === 'draw') {
      SEL = {
        x: Math.min(start.x, p.x), y: Math.min(start.y, p.y),
        w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y),
      };
    } else if (mode === 'move') {
      SEL.x = clamp(orig.x + (p.x - start.x), 0, p.mw - orig.w);
      SEL.y = clamp(orig.y + (p.y - start.y), 0, p.mh - orig.h);
    } else if (mode === 'resize') {
      const dx = p.x - start.x, dy = p.y - start.y;
      let { x, y, w, h } = orig;
      if (handle.includes('w')) { x = orig.x + dx; w = orig.w - dx; }
      if (handle.includes('e')) { w = orig.w + dx; }
      if (handle.includes('n')) { y = orig.y + dy; h = orig.h - dy; }
      if (handle.includes('s')) { h = orig.h + dy; }
      if (w < 12) { w = 12; }
      if (h < 12) { h = 12; }
      SEL = { x: clamp(x, 0, p.mw - 12), y: clamp(y, 0, p.mh - 12), w: w, h: h };
    }
    // 不要超出頁面
    SEL.w = Math.min(SEL.w, p.mw - SEL.x);
    SEL.h = Math.min(SEL.h, p.mh - SEL.y);
    drawSel();
  });

  window.addEventListener('mouseup', () => {
    if (!mode) return;
    mode = null; handle = null;
    document.body.classList.remove('resizing');
    commitAnchor();
  });
})();

/* markdown 語料沒有座標，維持原本的文字選取 */
$('docBody').addEventListener('mouseup', e => {
  if (DOC.isPdf || !e.target.closest('.doctext')) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const t = (sel.toString() || '').trim();
    if (t.length < 2) return;
    anchorText = t.slice(0, 4000);
    $('anchorText').textContent = anchorText;
    $('anchorThumb').classList.add('hidden');
    $('anchorBox').classList.remove('hidden');
    $('docQ').focus();
  }, 10);
});

/* ══════════ 文件問答 ══════════ */

$('docForm').onsubmit = ev => {
  ev.preventDefault();
  const q = $('docQ').value.trim();
  if (!q || !DOC.path) return;
  askDoc(q, anchorText);
};

function askDoc(q, anchored) {
  const log = $('chatLog');
  const thumb = $('anchorThumb').classList.contains('hidden') ? '' : $('anchorThumb').src;
  let raw = '';        // 原始 markdown —— 存筆記要存這個，不是渲染後的純文字

  const me = document.createElement('div');
  me.className = 'msg me';
  me.innerHTML = (anchored ? '<div class="anchored">' + esc(anchored) + '</div>' : '') +
                 '<div class="q">' + esc(q) + '</div>';
  log.appendChild(me);

  const ai = document.createElement('div');
  ai.className = 'msg ai';
  ai.innerHTML = '<div class="steps">思考中…</div><div class="body"></div>';
  log.appendChild(ai);
  ai.scrollIntoView({ block: 'nearest' });

  $('docQ').value = '';
  $('docGo').disabled = true;
  clearAnchor();

  const steps = [];
  const es = new EventSource('/api/ask?arch=doc_chat' +
    '&q=' + encodeURIComponent(q) +
    '&scope=' + encodeURIComponent(DOC.path) +
    '&selection=' + encodeURIComponent(anchored || ''));

  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === 'tool_call') {
      steps.push(ev.tool);
      ai.querySelector('.steps').textContent = steps.join(' → ');
    } else if (ev.type === 'answer') {
      raw = ev.text;
      ai.querySelector('.body').innerHTML = md(ev.text).replace(/\[([^\[\]\s]+#\d+)\]/g,
        (_, id) => '<span class="cite" data-id="' + id + '">' + id + '</span>');
      ai.querySelectorAll('.cite').forEach(el => {
        el.onclick = () => jumpToCitation(el.dataset.id);
      });
    } else if (ev.type === 'done') {
      ai.querySelector('.steps').textContent =
        (steps.length ? steps.join(' → ') + ' · ' : '') + (ev.elapsed_ms / 1000).toFixed(1) + ' 秒';
      es.close();
      $('docGo').disabled = false;
      noteBar(ai, () => ({
        question: q,
        answer: raw,
        anchor: anchored || '',
        source: DOC.path,
        arch: 'doc_chat',
        image: thumb || '',
        citations: [...ai.querySelectorAll('.cite')].map(c => c.dataset.id),
      }));
      ai.scrollIntoView({ block: 'nearest' });
    } else if (ev.type === 'error' && ev.fatal) {
      ai.querySelector('.body').textContent = '出錯了：' + ev.text;
      es.close();
      $('docGo').disabled = false;
    }
  };
  es.onerror = () => { es.close(); $('docGo').disabled = false; };
}

/** 文件問答裡點出處 → 直接翻到那一頁 */
function jumpToCitation(id) {
  fetch('/api/chunk?id=' + encodeURIComponent(id))
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(c => { if (c.page && c.path === DOC.path) gotoPage(c.page); })
    .catch(() => {});
}

/** 把一個片段（或一整份 PDF）畫進出處面板。showSource 與語料瀏覽器共用。 */
function renderSource(c) {
  const rel = c.path.replace(/^corpus\//, '');
  const viewer = c.is_pdf
    ? '<iframe class="pdfview" title="' + esc(c.path) + ' 第 ' + c.page + ' 頁" src="/api/pdf?path=' +
      encodeURIComponent(rel) + '#page=' + c.page + '&zoom=page-width"></iframe>' +
      '<a class="pdflink" target="_blank" rel="noopener" href="/api/pdf?path=' +
      encodeURIComponent(rel) + '#page=' + c.page + '">在新分頁開啟第 ' + c.page + ' 頁 ↗</a>' +
      (c.text
        ? '<details><summary>抽出來的純文字（檢索實際比對的內容）</summary><pre>' +
          esc(c.text) + '</pre></details>'
        : '')
    : esc(c.text);
  const where = c.page
    ? esc(c.path) + ' — 第 ' + c.page + ' 頁'
    : esc(c.path) + (c.heading ? ' — ' + esc(c.heading) : '');
  sourceView.innerHTML = '<div class="source-view"><div class="path">' + where + '</div>' + viewer + '</div>';
}

function showSource(id) {
  fetch('/api/chunk?id=' + encodeURIComponent(id))
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(c => {
      // PDF 出處直接開文件檢視器 —— 在那邊才圈選得到、也才翻得了頁
      if (c.is_pdf && c.page) { openDoc(c.path, true, c.page); return; }
      renderSource(c);
    })
    .catch(() => {
      sourceView.innerHTML = '<div class="source-view"><div class="path">找不到片段 ' + esc(id) +
        '</div>模型引用了不存在的 id —— 這正是要提醒學生檢查的地方。</div>';
    });
}

// 最小 markdown 渲染：只做答案裡真的會出現的那幾種語法。不拉函式庫是刻意的 —— 教室可能沒網路。
function md(src) {
  const fences = [];
  const t = esc(src).replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    fences.push('<pre>' + code.replace(/\n$/, '') + '</pre>');
    return '@@FENCE' + (fences.length - 1) + '@@';
  });

  const out = [];
  let table = null;
  const flushTable = () => {
    if (!table) return;
    const head = table[0], body = table.slice(1);
    out.push('<table><thead><tr>' + head.map(c => '<th>' + c + '</th>').join('') +
      '</tr></thead><tbody>' +
      body.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>');
    table = null;
  };

  t.split('\n').forEach(raw => {
    const line = raw.trimEnd();
    if (/^\|.*\|$/.test(line)) {
      if (/^[\s|:-]+$/.test(line)) return;
      if (!table) table = [];
      table.push(line.slice(1, -1).split('|').map(c => c.trim()));
      return;
    }
    flushTable();
    if (!line) { out.push(''); return; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push('<h3>' + h[2] + '</h3>'); return; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { out.push('<li>' + li[1] + '</li>'); return; }
    out.push(line);
  });
  flushTable();

  return out.join('\n')
    .replace(/(<li>[\s\S]*?<\/li>)(?!\n<li>)/g, '<ul>$1</ul>')
    .replace(/\n+(<(?:h3|ul|pre|table)[\s>])/g, '$1')
    .replace(/(<\/(?:h3|ul|pre|table)>)\n+/g, '$1')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/@@FENCE(\d+)@@/g, (_, i) => fences[i]);
}

function card(kind, html) {
  const d = document.createElement('div');
  d.className = 'node-card ' + kind;
  d.innerHTML = html;
  trace.appendChild(d);
  d.scrollIntoView({ block: 'nearest' });
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
